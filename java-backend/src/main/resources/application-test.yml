spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:h2:mem:admin-template-test;MODE=MySQL;DB_CLOSE_DELAY=-1}"
    username: "${SPRING_DATASOURCE_USERNAME:sa}"
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: "${SPRING_DATASOURCE_DRIVERCLASSNAME:org.h2.Driver}"
  sql:
    init:
      mode: never
