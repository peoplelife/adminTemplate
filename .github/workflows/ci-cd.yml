name: CI/CD

on:
  pull_request:
  push:
    branches: [matser]
  workflow_dispatch:

concurrency:
  group: production-matser
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: peoplelife
  IMAGE_TAG: ${{ github.sha }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        run: node --test tests/*.test.mjs
      - name: Type check
        working-directory: frontend
        run: pnpm exec vue-tsc --noEmit
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Java tests
        working-directory: java-backend
        run: mvn -B -ntp test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: ai-chat/uv.lock
      - name: Install dependencies
        working-directory: ai-chat
        run: uv sync --locked
      - name: Run Python tests
        working-directory: ai-chat
        run: uv run python -m unittest discover -s tests

  images:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [frontend, java, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/admin-template-frontend:${{ env.IMAGE_TAG }}
      - name: Build and push Java
        uses: docker/build-push-action@v6
        with:
          context: ./java-backend
          file: ./java-backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/admin-template-java:${{ env.IMAGE_TAG }}
      - name: Build and push Python
        uses: docker/build-push-action@v6
        with:
          context: ./ai-chat
          file: ./ai-chat/Dockerfile
          platforms: linux/amd64
          push: true
          build-contexts: |
            template-docs=./frontend/docs
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/admin-template-python:${{ env.IMAGE_TAG }}

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust deployment host
        shell: bash
        run: mkdir -p ~/.ssh && printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment files without production .env
        shell: bash
        run: tar --exclude='deploy/.env' -czf /tmp/admin-template-deploy.tgz deploy && scp -P "${{ secrets.DEPLOY_PORT }}" /tmp/admin-template-deploy.tgz "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/admin-template-deploy.tgz"
      - name: Release on server
        shell: bash
        run: ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "tar -xzf /tmp/admin-template-deploy.tgz -C /opt/apps/adminTemplate && rm -f /tmp/admin-template-deploy.tgz && cd /opt/apps/adminTemplate/deploy && IMAGE_TAG=${{ github.sha }} bash release.sh"
