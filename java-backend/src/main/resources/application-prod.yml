spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: "${APP_JWT_SECRET:}"
  upload:
    directory: "${APP_UPLOAD_DIRECTORY:public}"
